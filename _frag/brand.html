<!-- 桌面 springboard：点图标启动 -->
<article class="device" data-screen="springboard" data-nav="none" data-tab="none" data-theme="brand">
  <div style="position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%, #6D74E8 0%, #454DD6 45%, #2B3396 100%);color:#fff;padding:56px 20px 0;">
    <div style="text-align:center;font-size:15px;font-weight:600;opacity:.9;margin-bottom:24px;">周一 7月14日</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:22px 16px;">
      <div style="text-align:center;"><div style="width:56px;height:56px;border-radius:15px;margin:0 auto;background:#5AC8FA"></div><div style="font-size:11px;margin-top:6px;opacity:.92">健康</div></div>
      <div style="text-align:center;"><div style="width:56px;height:56px;border-radius:15px;margin:0 auto;background:#34C759"></div><div style="font-size:11px;margin-top:6px;opacity:.92">信息</div></div>
      <div style="text-align:center;"><div style="width:56px;height:56px;border-radius:15px;margin:0 auto;background:#FF9500"></div><div style="font-size:11px;margin-top:6px;opacity:.92">日历</div></div>
      <div style="text-align:center;"><div style="width:56px;height:56px;border-radius:15px;margin:0 auto;background:#FF3B30"></div><div style="font-size:11px;margin-top:6px;opacity:.92">邮件</div></div>
    </div>
    <div style="margin-top:52px;display:flex;flex-direction:column;align-items:center;">
      <div data-go="splash" data-mode="reset" style="position:relative;cursor:pointer;" class="xst-launch">
        <div style="position:absolute;inset:-14px;border-radius:28px;background:rgba(255,255,255,.18);"></div>
        <svg viewBox="0 0 100 100" style="position:relative;width:92px;height:92px;border-radius:23px;box-shadow:0 14px 32px -8px rgba(0,0,0,.5)"><use href="#xst-icon"/></svg>
      </div>
      <div style="font-size:14px;margin-top:12px;font-weight:600;">小身体</div>
      <div data-go="splash" data-mode="reset" style="font-size:12px;margin-top:16px;opacity:.85;background:rgba(255,255,255,.16);padding:7px 15px;border-radius:999px;cursor:pointer;">👉 点按打开</div>
    </div>
    <div style="position:absolute;left:14px;right:14px;bottom:22px;height:80px;border-radius:28px;background:rgba(255,255,255,.18);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-around;padding:0 16px;">
      <div style="width:54px;height:54px;border-radius:14px;background:#30B0C7"></div>
      <div style="width:54px;height:54px;border-radius:14px;background:#007AFF"></div>
      <div style="width:54px;height:54px;border-radius:14px;background:#8E8E93"></div>
      <div style="width:54px;height:54px;border-radius:14px;background:#34C759"></div>
    </div>
  </div>
</article>

<!-- 启动页 Splash：自动前进到引导 -->
<article class="device" data-screen="splash" data-nav="none" data-tab="none" data-theme="brand">
  <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;">
    <svg viewBox="0 0 100 100" style="width:96px;height:96px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.3))"><use href="#xst-mark"/></svg>
    <div style="font-size:34px;font-weight:800;margin-top:26px;letter-spacing:.06em;">小身体</div>
    <div style="font-size:14px;margin-top:12px;opacity:.82;">读懂身体的每一次波动</div>
    <div style="position:absolute;bottom:54px;font-size:11.5px;opacity:.55;">由 Ego 焕新 · v0.4.1</div>
  </div>
</article>
